name: fantasy-watch

on:
  schedule:
    # GitHub no garantiza la hora de los cron (con carga, se salta ejecuciones), y penaliza más
    # las horas en punto: 4 intentos por hora en minutos "raros". Para puntualidad real, ver
    # ESTADO.md ("Cron fiable": cron-job.org disparando workflow_dispatch).
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fantasy-watch
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04  # fijo: 'ubuntu-latest' pasa a Ubuntu 26 el 19/10/2026
    permissions:
      contents: write  # solo para publicar el estado en la rama `data` (export.py); EXPORT_DATA=0 lo desactiva
    timeout-minutes: 28  # deja margen para esperar al segundo exacto de un clausulazo programado (ver confirm.run_scheduled)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar estado (sesión + dedupe de alertas)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fantasy-state-${{ github.run_id }}
          restore-keys: |
            fantasy-state-

      - name: Sembrar sesión inicial si no hay caché todavía
        run: |
          mkdir -p data
          if [ ! -s data/tokens.json ] && [ -n "$FANTASY_TOKENS_JSON" ]; then
            echo "$FANTASY_TOKENS_JSON" > data/tokens.json
          fi
        env:
          FANTASY_TOKENS_JSON: ${{ secrets.FANTASY_TOKENS_JSON }}

      - name: fantasy tick
        run: python -m fantasy_agent tick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FANTASY_LEAGUE_ID: ${{ secrets.FANTASY_LEAGUE_ID }}
          FANTASY_TEAM_ID: ${{ secrets.FANTASY_TEAM_ID }}

      - name: Guardar estado actualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: fantasy-state-${{ github.run_id }}
